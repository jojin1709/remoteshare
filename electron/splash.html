<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1.5px solid #334155;
    border-radius: 16px;
  }
  .logo {
    width: 84px;
    height: 84px;
    border-radius: 20px;
    margin-bottom: 20px;
    box-shadow: 0 12px 28px rgba(37, 99, 235, 0.4);
    animation: float 2.5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }
  p {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 24px;
  }
  .loader {
    width: 140px;
    height: 4px;
    background: #1e293b;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .loader-bar {
    position: absolute;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, #38bdf8, #2563eb);
    border-radius: 4px;
    animation: load 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes load {
    0% { left: -50%; width: 30%; }
    50% { left: 30%; width: 60%; }
    100% { left: 100%; width: 30%; }
  }
  .version {
    position: absolute;
    bottom: 12px;
    font-size: 11px;
    color: #64748b;
  }
</style>
</head>
<body>
  <img src="icon.png" class="logo" alt="RemoteShare" />
  <h1>RemoteShare</h1>
  <p>Connecting P2P engine…</p>
  <div class="loader">
    <div class="loader-bar"></div>
  </div>
  <div class="version">v1.0.0 · Developed by JOJIN JOHN</div>
</body>
</html>
